<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="530" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C2C2A">RAG Document Q&amp;A - Architecture</text>

  <rect x="30" y="64" width="900" height="176" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.5"/>
  <text x="48" y="92" font-size="15" font-weight="bold" fill="#085041">1. Ingestion (once per file)</text>

  <g stroke="#0F6E56" stroke-width="1.5" fill="#ffffff">
    <rect x="45" y="108" width="150" height="104" rx="8"/>
    <rect x="225" y="108" width="150" height="104" rx="8"/>
    <rect x="405" y="108" width="150" height="104" rx="8"/>
    <rect x="585" y="108" width="150" height="104" rx="8"/>
    <rect x="765" y="108" width="150" height="104" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="142" font-size="15" font-weight="bold" fill="#085041">Upload</text>
    <text x="120" y="166" font-size="11" fill="#0F6E56">POST /api/documents</text>
    <text x="120" y="184" font-size="11" fill="#0F6E56">RagController</text>

    <text x="300" y="142" font-size="15" font-weight="bold" fill="#085041">Extract</text>
    <text x="300" y="166" font-size="11" fill="#0F6E56">TikaDocumentReader</text>
    <text x="300" y="184" font-size="11" fill="#0F6E56">PDF, DOCX, TXT</text>

    <text x="480" y="142" font-size="15" font-weight="bold" fill="#085041">Split</text>
    <text x="480" y="166" font-size="11" fill="#0F6E56">TokenTextSplitter</text>
    <text x="480" y="184" font-size="11" fill="#0F6E56">small chunks</text>

    <text x="660" y="142" font-size="15" font-weight="bold" fill="#085041">Embed</text>
    <text x="660" y="166" font-size="11" fill="#0F6E56">nomic-embed-text</text>
    <text x="660" y="184" font-size="11" fill="#0F6E56">via Ollama</text>

    <text x="840" y="142" font-size="15" font-weight="bold" fill="#085041">Vector store</text>
    <text x="840" y="166" font-size="11" fill="#0F6E56">SimpleVectorStore</text>
    <text x="840" y="184" font-size="11" fill="#0F6E56">in memory (RAM)</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="195" y1="160" x2="223" y2="160"/>
    <line x1="375" y1="160" x2="403" y2="160"/>
    <line x1="555" y1="160" x2="583" y2="160"/>
    <line x1="735" y1="160" x2="763" y2="160"/>
  </g>

  <rect x="30" y="288" width="900" height="176" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="48" y="316" font-size="15" font-weight="bold" fill="#3C3489">2. Query (every question)</text>

  <g stroke="#534AB7" stroke-width="1.5" fill="#ffffff">
    <rect x="45" y="332" width="150" height="104" rx="8"/>
    <rect x="225" y="332" width="150" height="104" rx="8"/>
    <rect x="405" y="332" width="150" height="104" rx="8"/>
    <rect x="585" y="332" width="150" height="104" rx="8"/>
    <rect x="765" y="332" width="150" height="104" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="366" font-size="15" font-weight="bold" fill="#3C3489">Question</text>
    <text x="120" y="390" font-size="11" fill="#534AB7">GET /api/ask?q=...</text>
    <text x="120" y="408" font-size="11" fill="#534AB7">RagController</text>

    <text x="300" y="366" font-size="15" font-weight="bold" fill="#3C3489">Embed</text>
    <text x="300" y="390" font-size="11" fill="#534AB7">nomic-embed-text</text>
    <text x="300" y="408" font-size="11" fill="#534AB7">same model</text>

    <text x="480" y="366" font-size="15" font-weight="bold" fill="#3C3489">Search</text>
    <text x="480" y="390" font-size="11" fill="#534AB7">similarity search</text>
    <text x="480" y="408" font-size="11" fill="#534AB7">top 4 chunks</text>

    <text x="660" y="366" font-size="15" font-weight="bold" fill="#3C3489">Prompt</text>
    <text x="660" y="390" font-size="11" fill="#534AB7">QuestionAnswerAdvisor</text>
    <text x="660" y="408" font-size="11" fill="#534AB7">question + context</text>

    <text x="840" y="366" font-size="15" font-weight="bold" fill="#3C3489">LLM answer</text>
    <text x="840" y="390" font-size="11" fill="#534AB7">qwen2.5:3b</text>
    <text x="840" y="408" font-size="11" fill="#534AB7">via Ollama</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="195" y1="384" x2="223" y2="384"/>
    <line x1="375" y1="384" x2="403" y2="384"/>
    <line x1="555" y1="384" x2="583" y2="384"/>
    <line x1="735" y1="384" x2="763" y2="384"/>
  </g>

  <path d="M840 212 V266 H480 V329" fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="660" y="258" text-anchor="middle" font-size="12" fill="#534AB7">stored chunks are searched</text>

  <text x="480" y="496" text-anchor="middle" font-size="13" fill="#5F5E5A">Java 25 | Spring Boot 4.1.2 | Spring AI 2.0.1 | Ollama (runs locally)</text>
</svg>
